<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flight Simulator</title>
    <link href="favicon.png" rel="icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 100;
        }

        #hud div {
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
        }

        #controls-help {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 100;
        }

        #controls-help h3 {
            margin-bottom: 8px;
            color: #0f0;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Flight Simulator...</div>

    <div id="canvas-container"></div>

    <div id="hud">
        <div>AIRSPEED: <span id="hud-speed">0</span> knots</div>
        <div>ALTITUDE: <span id="hud-altitude">0</span> ft</div>
        <div>THROTTLE: <span id="hud-throttle">0</span>%</div>
        <div>CAMERA: <span id="hud-camera">CHASE</span></div>
    </div>

    <div id="controls-help">
        <h3>CONTROLS</h3>
        W/S or ↑/↓ - Pitch<br>
        A/D or ←/→ - Roll<br>
        Q/E - Yaw<br>
        Shift - Throttle Up<br>
        Ctrl - Throttle Down<br>
        C - Cycle Camera<br>
        R - Reset Position
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
